services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: society
      POSTGRES_PASSWORD: "Z0sAePlN-k54pVLdH9GD_WWsjdLREaBa"
    volumes:
      - society_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "8xQQ6wKZ8c2RKgld4U_QOJj2_3Tvf0nh"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: society_test
      POSTGRES_PASSWORD: "9FrXOUNunw-ofTjLIZmabZkHeC4w310z"
    volumes:
      - society_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "D00bBtKFkNl8jJPU_u4Tx0QnxVDreenJ"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  society_data:
  society_test_data:
